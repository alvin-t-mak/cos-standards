name: ci

# Installs this checkout and runs the tests, cos-lint, the PR body check, and cos-verify.
# It does not call lint.yml: that workflow installs whatever is already on main,
# so a pull request would be graded against the last release instead of its own diff.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint this repo
        run: cos-lint
      - name: Comments
        run: cos-check-comments
      - name: PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/compare.json"
          cos-check-pr-body --event "$GITHUB_EVENT_PATH" --compare-file "$RUNNER_TEMP/compare.json"
      - name: Verify models
        run: cos-verify --receipt verify-receipt.json
