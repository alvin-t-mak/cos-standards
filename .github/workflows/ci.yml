name: ci

# Installs this checkout and runs the tests plus cos-lint.
# It does not call lint.yml: that workflow installs whatever is already on main,
# so a pull request would be graded against the last release instead of its own diff.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint this repo
        run: cos-lint
