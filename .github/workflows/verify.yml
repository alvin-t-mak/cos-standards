name: verify

# Called by a consuming repo:
#   uses: alvin-t-mak/cos-standards/.github/workflows/verify.yml@main
# The job checks out the caller and installs this package at `ref` (default main).

on:
  workflow_call:
    inputs:
      config:
        description: Path to cos.yaml or standards/local.yaml. Empty searches those two names.
        required: false
        type: string
        default: ""
      ref:
        description: Git ref of cos-standards to install. main is what a merge here ships.
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc

      - name: Install cos-standards
        env:
          COS_REF: ${{ inputs.ref }}
        run: python -m pip install "cos-standards @ git+https://github.com/alvin-t-mak/cos-standards@${COS_REF}"

      - name: Verify models
        env:
          COS_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [ -n "$COS_CONFIG" ]; then
            cos-verify --receipt verify-receipt.json --config "$COS_CONFIG"
          else
            cos-verify --receipt verify-receipt.json
          fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-receipt
          path: verify-receipt.json
