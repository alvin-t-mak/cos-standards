name: lint

# Called by a consuming repo:
#   uses: alvin-t-mak/cos-standards/.github/workflows/lint.yml@main
# The job checks out the caller and installs this package at `ref` (default main).
# A merge to main is what the next caller run installs.

on:
  workflow_call:
    inputs:
      config:
        description: Path to cos.yaml or standards/local.yaml. Empty searches those two names.
        required: false
        type: string
        default: ""
      ref:
        description: Git ref of cos-standards to install. main is what a merge here ships.
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cos-standards
        env:
          COS_REF: ${{ inputs.ref }}
        run: python -m pip install "cos-standards @ git+https://github.com/alvin-t-mak/cos-standards@${COS_REF}"

      - name: Lint
        env:
          COS_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [ -n "$COS_CONFIG" ]; then
            cos-lint --config "$COS_CONFIG"
          else
            cos-lint
          fi

      - name: PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/compare.json"
          cos-check-pr-body --event "$GITHUB_EVENT_PATH" --compare-file "$RUNNER_TEMP/compare.json"
